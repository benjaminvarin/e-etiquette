<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Vin rouge – Lot L26-11</title>
<style>
  @font-face {
    font-family: "Space Mono";
    src: url("../fonts/space-mono-latin-400-normal.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --fond: #fff;
    --texte: #000;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #000;
      --texte: #fff;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font: inherit; }

  html {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 16px;
    line-height: 1.5;
    background: var(--fond);
    color: var(--texte);
    -webkit-text-size-adjust: 100%;
  }

  body {
    max-width: 36rem;
    margin: 0 auto;
    padding: 2rem 1rem 3rem;
  }

  main, section + section { margin-top: 1.5rem; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; }
  td { text-align: right; white-space: nowrap; padding-left: 1rem; }
  th, td { padding-top: .25rem; padding-bottom: .25rem; border-bottom: 1px solid var(--texte); }
  tr.sous th { padding-left: 1rem; }
  caption { text-align: left; padding-bottom: .5rem; }
</style>
</head>
<body>

<header>
  <h1>La Varette<br>Vin de France – Vin rouge<br>Lot L26-11</h1>
</header>

<main>
  <section>
    <h2>Ingrédients</h2>
    <p>Raisins.</p>
  </section>

  <section>
    <h2>Allergènes</h2>
    <p>Contient des sulfites.</p>
  </section>

  <section>
    <table>
      <caption>Déclaration nutritionnelle pour 100&nbsp;ml</caption>
      <tbody>
        <tr><th scope="row">Énergie</th><td>232&nbsp;kJ / 56&nbsp;kcal</td></tr>
        <tr><th scope="row">Matières grasses</th><td>0&nbsp;g</td></tr>
        <tr class="sous"><th scope="row">dont acides gras saturés</th><td>0&nbsp;g</td></tr>
        <tr><th scope="row">Glucides</th><td>0,2&nbsp;g</td></tr>
        <tr class="sous"><th scope="row">dont sucres</th><td>0,2&nbsp;g</td></tr>
        <tr><th scope="row">Protéines</th><td>0&nbsp;g</td></tr>
        <tr><th scope="row">Sel</th><td>0&nbsp;g</td></tr>
      </tbody>
    </table>
  </section>
</main>

</body>
</html>
